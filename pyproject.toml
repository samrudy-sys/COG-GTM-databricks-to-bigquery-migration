[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["legacy/databricks/notebooks"]  # exported Databricks notebooks use injected globals (spark, dbutils)

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E702", "E731", "I001"]

[tool.ruff.lint.per-file-ignores]
".devin/skills/migrate-product/workflow.py" = ["F821"]  # agent/parallel/log/register_workflow come from the workflow runtime
